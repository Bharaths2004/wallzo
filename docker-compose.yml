# ================================================================
# docker-compose.yml
# PURPOSE: Full production stack — Postgres + Backend + Frontend (Nginx)
#          Everything runs inside Docker. Deploy this to any VPS.
# USAGE:   docker compose up -d --build
# ================================================================

services:

  # ── PostgreSQL Database ────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: wallzo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wallzo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-wallzodb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wallzo_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wallzo_user} -d ${POSTGRES_DB:-wallzodb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Express Backend API ────────────────────────────────────────
  backend:
    build:
      context: ./wallzo-backend
      dockerfile: Dockerfile
    container_name: wallzo_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-wallzo_user}:${POSTGRES_PASSWORD:-changeme_in_production}@postgres:5432/${POSTGRES_DB:-wallzodb}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
    volumes:
      - uploads_data:/app/uploads   # Persist uploaded images
    networks:
      - wallzo_network
    depends_on:
      postgres:
        condition: service_healthy
    # Runs migrations then starts server
    command: >
      sh -c "npx prisma migrate deploy && node src/server.js"

  # ── React Frontend (served by Nginx) ──────────────────────────
  frontend:
    build:
      context: ./wallzo-react
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: wallzo_frontend
    restart: unless-stopped
    networks:
      - wallzo_network
    depends_on:
      - backend

  # ── Nginx Reverse Proxy ────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: wallzo_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads_data:/var/www/uploads:ro   # Serve uploaded images directly
    networks:
      - wallzo_network
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:       # Persistent database storage
  uploads_data:        # Persistent image uploads

networks:
  wallzo_network:
    driver: bridge
